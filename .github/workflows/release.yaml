name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: desec-rs
            asset: desec-rs-linux-x86_64
          - os: windows-latest
            bin: desec-rs.exe
            asset: desec-rs-windows-x86_64.exe
          - os: macos-latest
            bin: desec-rs
            asset: desec-rs-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - env:
          APP_VERSION: ${{ github.event.release.tag_name }}
        run: cargo build --release --locked
      - run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
